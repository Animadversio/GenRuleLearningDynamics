[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "genrule-learning-dynamics"
version = "0.1.0"
description = "Rule learning and memorization dynamics in generative models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
images = ["opencv-python>=4.8"]
torch = ["torch>=2.0"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
