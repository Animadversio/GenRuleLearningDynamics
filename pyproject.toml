[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "genrule-learning-dynamics"
version = "0.2.0"
description = "Rule learning and memorization dynamics in generative models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
images = ["opencv-python>=4.8"]
torch = ["torch>=2.0"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=8"]
models = ["torch>=2.4", "torchvision>=0.19", "timm>=1.0.7", "transformers>=5.5", "tensorboard>=2.12", "tqdm>=4.66"]
llm = ["torch>=2.8", "transformers>=5.14.1", "trl>=1.9.2", "datasets>=5", "accelerate>=1.14", "wandb>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
genrule-train-gpt = "genrule.cli.train_gpt:main"
genrule-train-diffusion = "genrule.cli.train_diffusion:main"
genrule-train-llm = "genrule.cli.train_llm:main"

[tool.setuptools]
license-files = ["LICENSES/*.txt"]
